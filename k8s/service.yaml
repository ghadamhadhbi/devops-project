apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: fastapi-app
  labels:
    app: fastapi-devops
spec:
  type: NodePort
  selector:
    app: fastapi-devops
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
  sessionAffinity: None
